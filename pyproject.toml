[project]
name = "dash_on_flask"
version = "0.1.0"
description = "Dash app integrated with Flask and authentication"
requires-python = ">=3.11"
dependencies = [
    "Flask>=1.1.2",
    "Flask-Login>=0.5.0",
    "Flask-SQLAlchemy>=2.5.1",
    "Flask-Migrate>=2.7.0",
    "Flask-WTF>=0.14.3",
    "dash>=1.20.0",
    "pandas-datareader>=0.9.0",
    "gunicorn>=20.1.0",
    "python-dotenv>=0.17.1",
    "waitress",
    "dash-bootstrap-components",
    "dash-ag-grid",
    "commonlog",
    "pandas",
    "requests",
    "SQLAlchemy",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-flask>=1.3.0",
]

[project.scripts]
app-server = "dashapp:main"
start = "dashapp:main"

[tool.setuptools]
packages = ["app"]
py-modules = ["dashapp", "root_logger"]

[tool.uv]
package = true

[tool.uv.sources]
commonlog = { git = "https://github.com/HelloMorrisMoss/logger_setup.git" }

[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"
